<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Учёт воды · демонстрационные данные</title>
    <style>
      :root {
        color-scheme: light;
        --primary-background-color: #f4f7fa;
        --secondary-background-color: #edf2f7;
        --card-background-color: #fff;
        --ha-card-background: #fff;
        --primary-text-color: #20242a;
        --secondary-text-color: #6e7782;
        --divider-color: rgba(79, 96, 113, .18);
        --success-color: #28a968;
        --warning-color: #e59112;
        --error-color: #dd4148;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--primary-background-color);
      }
    </style>
    <script>
      class PreviewHaIcon extends HTMLElement {
        connectedCallback() {
          const icons = {
            "mdi:menu": "☰",
            "mdi:refresh": "↻",
            "mdi:home-flood": "⌂",
            "mdi:cup-water": "●",
            "mdi:sprinkler-variant": "✦",
            "mdi:format-list-checks": "≡",
            "mdi:counter": "#",
            "mdi:chart-timeline-variant": "▥",
            "mdi:water-outline": "◉",
            "mdi:chart-bar": "▥",
            "mdi:chart-box-outline": "▥",
            "mdi:cog-outline": "⚙",
            "mdi:cog": "⚙",
            "mdi:gauge": "◴",
            "mdi:stethoscope": "+",
            "mdi:water-check": "✓",
            "mdi:thermometer": "°",
            "mdi:battery": "▰",
            "mdi:signal": "⌁",
            "mdi:clock-outline": "◷",
          };
          const symbol = icons[this.getAttribute("icon")] || "·";
          this.attachShadow({ mode: "open" }).innerHTML = `<style>:host{display:inline-grid;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);place-items:center;font:800 calc(var(--mdc-icon-size,24px)*.8)/1 system-ui}</style>${symbol}`;
        }
      }
      customElements.define("ha-icon", PreviewHaIcon);
      const query = new URLSearchParams(location.search);
      localStorage.setItem("nikas.water-accounting.view.v1", query.get("view") || "overview");
      localStorage.setItem("nikas.water-accounting.period.v1", query.get("period") || "24h");
      const NativeDate = Date;
      const previewNow = NativeDate.parse('2026-11-08T12:00:00Z');
      window.Date = class extends NativeDate {
        constructor(...args) { super(...(args.length ? args : [previewNow])); }
        static now() { return previewNow; }
      };
    </script>
    <script src="../custom_components/water_accounting/frontend/water-accounting-panel.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const entities = {
        pressure_drinking: "sensor.nikas_h2000_pro_pitevaia_voda",
        pressure_irrigation: "sensor.nikas_h2000_pro_voda_na_poliv_2",
        zont_online: "binary_sensor.nikas_h2000_pro_online",
        drinking_total: "sensor.schetchik_vody_svd_20_0020989_pokazaniia",
        drinking_temperature: "sensor.schetchik_vody_svd_20_0020989_temperatura",
        drinking_battery: "sensor.schetchik_vody_svd_20_0020989_batareia",
        drinking_signal: "sensor.schetchik_vody_svd_20_0020989_signal",
        drinking_updated: "sensor.schetchik_vody_svd_20_0020989_obnovleno",
        irrigation_total: "sensor.schetchik_vody_svd_20_0020988_pokazaniia",
        irrigation_temperature: "sensor.schetchik_vody_svd_20_0020988_temperatura",
        irrigation_battery: "sensor.schetchik_vody_svd_20_0020988_batareia",
        irrigation_signal: "sensor.schetchik_vody_svd_20_0020988_signal",
        irrigation_updated: "sensor.schetchik_vody_svd_20_0020988_obnovleno",
      };
      const stamp = new Date().toISOString();
      const state = (value, unit, extra = {}) => ({
        state: String(value),
        attributes: { unit_of_measurement: unit, ...extra },
        last_updated: stamp,
      });
      const states = {
        [entities.pressure_drinking]: state(2.74, "bar", { device_class: "pressure" }),
        [entities.pressure_irrigation]: state(2.82, "bar", { device_class: "pressure" }),
        [entities.zont_online]: state("on", ""),
        [entities.drinking_total]: state(183.742, "m³", { device_class: "water", state_class: "total_increasing" }),
        [entities.drinking_temperature]: state(17.8, "°C"),
        [entities.drinking_battery]: state(84, "%"),
        [entities.drinking_signal]: state(-61, "dBm"),
        [entities.drinking_updated]: state(stamp, "", { device_class: "timestamp" }),
        [entities.irrigation_total]: state(76.421, "m³", { device_class: "water", state_class: "total_increasing" }),
        [entities.irrigation_temperature]: state(13.2, "°C"),
        [entities.irrigation_battery]: state(73, "%"),
        [entities.irrigation_signal]: state(-68, "dBm"),
        [entities.irrigation_updated]: state(stamp, "", { device_class: "timestamp" }),
      };
      if (query.has('disabled')) {
        states[entities.pressure_irrigation] = state(0,'bar');
        states[entities.irrigation_total] = state('unavailable','m³');
        states[entities.irrigation_updated] = state('unavailable','');
      }
      let settingsSnapshot = {revision:0,settings:{statistics_start_date:'2026-10-27',
        low_day_threshold_l:100,regeneration_verified_from:'2026-10-27',
        regeneration_verified_through:'2026-11-07',irrigation:{enabled:!query.has('disabled'),
          reason:query.has('disabled')?'На зиму':'',since:query.has('disabled')?'2026-11-01':null}}};
      const treatmentSnapshot = {revision:1,settings:{salt:{history:[
        {action:'regeneration',date:'2026-10-29',water_m3:0.22,result:'confirmed'},
        {action:'regeneration',date:'2026-11-03',water_m3:0.24,result:'unverified'},
        {action:'regeneration',date:'2026-11-07',water_m3:0.23,result:'confirmed'},
      ]}}};

      function mockStatistics(message) {
        const step = 3_600_000;
        const start = Date.parse(message.start_time);
        const count = Math.ceil((Date.parse(message.end_time) - start) / step);
        const result = {};
        message.statistic_ids.forEach((entityId, entityIndex) => {
          let sum = entityIndex ? 76 : 183;
          result[entityId] = Array.from({ length: count }, (_unused, index) => {
            const base = entityIndex ? (index % 4 === 0 ? 0.18 : 0.035) : 0.022 + (index % 5) * 0.006;
            const change = base;
            sum += change;
            return { start: start + index * step, change, sum, state: sum };
          });
        });
        return result;
      }

      async function mockWebSocket(message) {
        (window.previewRequests ||= []).push(structuredClone(message));
        if (message.type === 'recorder/statistics_during_period') return mockStatistics(message);
        if (message.type === 'water_treatment/filters' && (message.action || 'get') === 'get') {
          return structuredClone(treatmentSnapshot);
        }
        if (message.type === 'water_accounting/settings') {
          if ((message.action || 'get') === 'get') return structuredClone(settingsSnapshot);
          if (query.has('readonly')) throw {code:'unauthorized',message:'Нужны права администратора'};
          if (message.revision !== settingsSnapshot.revision) throw {code:'revision_conflict',message:'Настройки изменились на другом устройстве'};
          settingsSnapshot = {revision:settingsSnapshot.revision+1,settings:{...settingsSnapshot.settings,...message.payload}};
          return structuredClone(settingsSnapshot);
        }
        throw {code:'unknown_command',message:'Неизвестная демонстрационная команда'};
      }

      const panel = document.createElement("nikas-water-accounting-panel");
      panel.panel = {
        config: {
          title: "Учёт воды",
          ui_version: "0.3.0-beta002",
          parent_route: "/dashboard-house-v13/home",
          entities,
        },
      };
      panel.hass = {
        locale: { language: "ru" },
        user: {is_admin:!query.has('readonly')},
        config: {time_zone:'Europe/Moscow'},
        states,
        callWS: mockWebSocket,
        callService: async () => undefined,
      };
      document.getElementById("root").appendChild(panel);
    </script>
  </body>
</html>
